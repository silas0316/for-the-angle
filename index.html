<title>For the Angle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700;800&display=swap">

<style>
/* Pet Adoption Platform — Motion-Driven + Claymorphism, in a blue tone.
   Fredoka + Nunito Sans · pill buttons · 24px cards · soft colour-tinted shadows */
:root{
  color-scheme:light;
  --page:#EDF5FC;
  --knockout:#FFFFFF;          /* opaque card colour, for canvas knockouts */
  --panel:#FFFFFF;
  --sunk:#F2F8FD;
  --ink:#1E3550;
  --ink-2:#5B7691;
  --ink-3:#93A8BE;
  --line:#DCEAF6;
  --accent:#2E90E0;
  --accent-soft:#D6ECFB;
  --accent-line:#1F79C4;
  --on-accent:#FFFFFF;
  --grid:rgba(30,53,80,.15);
  --ax-x:#E0603F;
  --ax-y:#38A268;
  --ax-z:#5B4BD6;
  --shadow:0 8px 24px rgba(30,53,80,.09);
  --shadow-lift:0 12px 28px rgba(30,53,80,.13);
  --shadow-accent:0 6px 18px rgba(46,144,224,.32);
  --inset:inset 0 2px 0 rgba(255,255,255,.85);
  --r-card:24px;
  --r-pill:50px;
  --r-sm:14px;
  --haze-a:rgba(135,206,235,.42);
  --haze-b:rgba(46,144,224,.20);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0D1926;
    --knockout:#16273A;
    --panel:#16273A;
    --sunk:#1B2F45;
    --ink:#E7F1FA;
    --ink-2:#9DB4CA;
    --ink-3:#6D8398;
    --line:#25405B;
    --accent:#4FA8F0;
    --accent-soft:#1E3A55;
    --accent-line:#6FBBF5;
    --on-accent:#0B1826;
    --grid:rgba(231,241,250,.11);
    --ax-x:#F0916B;
    --ax-y:#5FC58C;
    --ax-z:#8B8BF0;
    --shadow:0 8px 24px rgba(0,0,0,.42);
    --shadow-lift:0 12px 28px rgba(0,0,0,.5);
    --shadow-accent:0 6px 18px rgba(79,168,240,.28);
    --inset:inset 0 2px 0 rgba(255,255,255,.06);
    --haze-a:rgba(79,168,240,.20);
    --haze-b:rgba(46,144,224,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0D1926;
  --knockout:#16273A;
  --panel:#16273A;
  --sunk:#1B2F45;
  --ink:#E7F1FA;
  --ink-2:#9DB4CA;
  --ink-3:#6D8398;
  --line:#25405B;
  --accent:#4FA8F0;
  --accent-soft:#1E3A55;
  --accent-line:#6FBBF5;
  --on-accent:#0B1826;
  --grid:rgba(231,241,250,.11);
  --ax-x:#F0916B;
  --ax-y:#5FC58C;
  --ax-z:#8B8BF0;
  --shadow:0 8px 24px rgba(0,0,0,.42);
  --shadow-lift:0 12px 28px rgba(0,0,0,.5);
  --shadow-accent:0 6px 18px rgba(79,168,240,.28);
  --inset:inset 0 2px 0 rgba(255,255,255,.06);
  --haze-a:rgba(79,168,240,.20);
  --haze-b:rgba(46,144,224,.14);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:"Nunito Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46vw 38vw at 84% 2%, var(--haze-a), transparent 66%),
    radial-gradient(44vw 40vw at 6% 96%, var(--haze-b), transparent 68%);
}
.wrap{max-width:1320px;margin:0 auto;padding:36px 22px 72px;display:flex;flex-direction:column;gap:20px}

/* ---- header ---- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{
  font-family:"Fredoka","Nunito Sans",sans-serif;
  font-size:36px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1;color:var(--ink);
}
.sub{
  margin:6px 0 0;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:.005em;
}
.reset,.langsel,.lock,.copy,.lens button,.step button,.objs button{
  font-family:"Nunito Sans",sans-serif;
}
.reset{
  font-size:12.5px;font-weight:700;
  background:var(--accent);border:0;color:var(--on-accent);
  padding:12px 22px;border-radius:var(--r-pill);cursor:pointer;
  box-shadow:var(--shadow-accent);transition:transform .18s,box-shadow .18s,filter .18s;
}
.reset:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);filter:brightness(1.06)}
.reset:active{transform:translateY(0)}
.acts{display:flex;align-items:center;gap:10px}
.langsel{
  font-size:12.5px;font-weight:600;
  background:var(--panel);border:1.5px solid var(--line);color:var(--ink-2);
  padding:11px 34px 11px 16px;border-radius:var(--r-pill);cursor:pointer;
  box-shadow:var(--shadow);
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  transition:border-color .18s,color .18s;
}
.langsel:hover{border-color:var(--accent);color:var(--ink)}

/* ---- subject chips (pill row, like the demo's Dogs / Cats / Rabbits) ---- */
.objs{display:flex;flex-wrap:wrap;gap:9px;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible;width:fit-content}
.objs button{
  font-size:13px;font-weight:700;
  background:var(--panel);border:1.5px solid var(--line);border-right:1.5px solid var(--line);
  color:var(--ink-2);padding:10px 20px;cursor:pointer;border-radius:var(--r-pill);
  box-shadow:var(--shadow);transition:transform .18s,color .18s,background .18s,border-color .18s;
}
.objs button:last-child{border-right:1.5px solid var(--line)}
.objs button:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.objs button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  box-shadow:var(--shadow-accent);
}

/* ---- viewports ---- */
.stage{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pane{margin:0;position:relative;background:var(--panel);border:1.5px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--shadow),var(--inset);overflow:hidden}
.pane canvas{display:block;width:100%;aspect-ratio:3/2;touch-action:none;cursor:grab}
.pane canvas:active{cursor:grabbing}
.pane canvas:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.cap{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:16px 20px;pointer-events:none;
  font:700 11px/1 "Nunito Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.cap b{font-weight:700;color:var(--accent)}
/* viewfinder corner ticks on the camera pane */
.ticks{position:absolute;inset:38px 20px 20px;pointer-events:none}
.ticks i{position:absolute;width:16px;height:16px;border:0 solid var(--accent);border-radius:3px}
.ticks i:nth-child(1){top:0;left:0;border-top-width:2.5px;border-left-width:2.5px;border-top-left-radius:8px}
.ticks i:nth-child(2){top:0;right:0;border-top-width:2.5px;border-right-width:2.5px;border-top-right-radius:8px}
.ticks i:nth-child(3){bottom:0;left:0;border-bottom-width:2.5px;border-left-width:2.5px;border-bottom-left-radius:8px}
.ticks i:nth-child(4){bottom:0;right:0;border-bottom-width:2.5px;border-right-width:2.5px;border-bottom-right-radius:8px}
.hint{
  position:absolute;bottom:14px;left:20px;right:20px;pointer-events:none;
  font:400 11.5px/1.5 "Nunito Sans",sans-serif;color:var(--ink-3);
}

/* ---- control rack ---- */
.rack{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow),var(--inset);overflow:hidden}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 14rem;align-items:center;gap:16px;padding:14px 22px;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row>label,.row>.lbl{
  font:700 13px/1 "Fredoka","Nunito Sans",sans-serif;letter-spacing:.01em;text-transform:none;color:var(--ink);
}
.note{font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.note b{font-weight:800;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}

.row>.lbl em{font-style:normal;font-family:"Nunito Sans",sans-serif;font-weight:400;font-size:12px;color:var(--ink-3);margin-left:.5em;letter-spacing:0}
.row--read{background:var(--accent-soft)}
.read{font:800 14px/1 "Nunito Sans",sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.01em}
.step{display:flex;align-items:center;gap:0;width:fit-content;border:1.5px solid var(--line);border-radius:var(--r-pill);background:var(--sunk);overflow:hidden}
.step button{
  font:400 19px/1 "Nunito Sans",sans-serif;
  background:none;border:0;color:var(--ink-2);width:38px;height:38px;cursor:pointer;transition:color .18s,background .18s;
}
.step button:hover{color:var(--on-accent);background:var(--accent)}
.step .v{
  font:800 14px/1 "Nunito Sans",sans-serif;font-variant-numeric:tabular-nums;
  min-width:62px;text-align:center;color:var(--ink);
  border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);padding:12px 0;
}
.ctl{display:flex;align-items:center;gap:10px}
.lock{
  font-size:11.5px;font-weight:700;
  background:var(--sunk);border:1.5px solid var(--line);color:var(--ink-3);
  padding:10px 16px;border-radius:var(--r-pill);cursor:pointer;transition:color .18s,border-color .18s,transform .18s;
}
.lock:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.lock[data-lock="0"][aria-pressed="true"]{background:var(--ax-x);border-color:var(--ax-x);color:var(--knockout)}
.lock[data-lock="1"][aria-pressed="true"]{background:var(--ax-y);border-color:var(--ax-y);color:var(--knockout)}
.lock[data-lock="2"][aria-pressed="true"]{background:var(--ax-z);border-color:var(--ax-z);color:var(--knockout)}
.step button:disabled{opacity:.3;cursor:default}
.step button:disabled:hover{color:var(--ink-2);background:none}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;max-width:300px;
  background:transparent;height:22px;cursor:pointer;accent-color:var(--accent);
}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:var(--r-pill);background:var(--sunk);border:1.5px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:3px solid var(--panel);box-shadow:var(--shadow-accent);margin-top:-7.5px;
}
input[type=range]::-moz-range-track{height:8px;border-radius:var(--r-pill);background:var(--sunk);border:1.5px solid var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:var(--r-pill);background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:var(--shadow-accent)}
.lens{display:flex;gap:7px;flex-wrap:wrap}
.lens button{
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--sunk);border:1.5px solid var(--line);color:var(--ink-2);
  padding:9px 14px;border-radius:var(--r-pill);cursor:pointer;transition:color .18s,border-color .18s,transform .18s;
}
.lens button:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.lens button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent)}

/* ---- output ---- */
.out{background:var(--panel);border:1.5px solid var(--line);border-left:1.5px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--shadow),var(--inset);padding:24px 28px 28px}
.out__head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}
.tag{font:700 11.5px/1 "Nunito Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-line);
  background:var(--accent-soft);padding:7px 14px;border-radius:var(--r-pill)}
.copy{
  font-size:12.5px;font-weight:700;
  background:var(--accent);border:0;color:var(--on-accent);padding:12px 24px;border-radius:var(--r-pill);cursor:pointer;
  box-shadow:var(--shadow-accent);transition:transform .18s,box-shadow .18s,filter .18s;
}
.copy:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);filter:brightness(1.06)}
.copy[data-done]{background:var(--ax-y);box-shadow:none}
#sentence{
  margin:0;font-family:"Nunito Sans",sans-serif;font-size:21px;line-height:1.55;
  font-weight:400;letter-spacing:.002em;color:var(--ink);max-width:60ch;
}
.foot{font:400 12.5px/1.7 "Nunito Sans",sans-serif;color:var(--ink-3);letter-spacing:0;text-transform:none}
.foot b{font-weight:700;color:var(--ink-2)}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}

@media (max-width:760px){
  .wrap{padding:26px 16px 56px}
  h1{font-size:29px}
  .stage{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto;gap:10px 14px}
  .row>label,.row>.lbl{grid-column:1}
  .note{grid-column:1/-1;text-align:left}
  #sentence{font-size:19px}
}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>For the Angle</h1>
      <p class="sub" id="sub">Move the camera by X / Y / Z or drag to orbit · copy the sentence</p>
    </div>
    <div class="acts">
      <select class="langsel" id="lang" aria-label="Language"></select>
      <button class="reset" id="reset">Reset</button>
    </div>
  </div>

  <nav class="objs" id="objs" aria-label="Subject"></nav>

  <div class="stage">
    <figure class="pane">
      <canvas id="rig" tabindex="0" aria-label="Rig view. Drag, or use arrow keys, to move the camera around the subject."></canvas>
      <figcaption class="cap"><b id="capRigLbl">Rig</b><span id="capRig">az 45 · el 30</span></figcaption>
      <span class="hint" id="hintRig">drag a track to slide · click its letter to lock · drag empty space to orbit</span>
    </figure>
    <figure class="pane">
      <canvas id="cam" tabindex="0" aria-label="Camera view. Drag, or use arrow keys, to move the camera around the subject."></canvas>
      <div class="ticks"><i></i><i></i><i></i><i></i></div>
      <figcaption class="cap"><b id="capCamLbl">Camera</b><span id="capCam">50mm</span></figcaption>
    </figure>
  </div>

  <div class="rack">
    <div class="row">
      <span class="lbl">X <em id="em-x">side</em></span>
      <div class="ctl">
      <div class="step">
        <button data-ax="0" data-d="-1" aria-label="Move camera toward the subject's left">−</button>
        <span class="v" id="v-x">0.0</span>
        <button data-ax="0" data-d="1" data-plus aria-label="Move camera toward the subject's right">+</button>
      </div>
      <button class="lock" data-lock="0" aria-pressed="false" aria-label="Lock the X axis">Lock</button>
      </div>
      <span class="note" id="n-x"></span>
    </div>
    <div class="row">
      <span class="lbl">Y <em id="em-y">height</em></span>
      <div class="ctl">
      <div class="step">
        <button data-ax="1" data-d="-1" aria-label="Lower camera">−</button>
        <span class="v" id="v-y">0.0</span>
        <button data-ax="1" data-d="1" data-plus aria-label="Raise camera">+</button>
      </div>
      <button class="lock" data-lock="1" aria-pressed="false" aria-label="Lock the Y axis">Lock</button>
      </div>
      <span class="note" id="n-y"></span>
    </div>
    <div class="row">
      <span class="lbl">Z <em id="em-z">depth</em></span>
      <div class="ctl">
      <div class="step">
        <button data-ax="2" data-d="-1" aria-label="Move camera behind the subject">−</button>
        <span class="v" id="v-z">0.0</span>
        <button data-ax="2" data-d="1" data-plus aria-label="Move camera in front of the subject">+</button>
      </div>
      <button class="lock" data-lock="2" aria-pressed="false" aria-label="Lock the Z axis">Lock</button>
      </div>
      <span class="note" id="n-z"></span>
    </div>
    <div class="row">
      <label for="dist" id="lbl-dist">Distance</label>
      <input id="dist" type="range" min="1.5" max="10" step="0.5" value="3.5">
      <span class="note"><b id="v-d">3.5</b> <span id="n-d"></span></span>
    </div>
    <div class="row">
      <span class="lbl" id="lbl-lens">Lens</span>
      <div class="lens" id="lens"></div>
      <span class="note" id="n-f"></span>
    </div>
    <div class="row row--read">
      <span class="lbl" id="lbl-angle">Angle</span>
      <span class="read" id="v-ang">45° az · +30° el</span>
      <span class="note" id="n-ang"></span>
    </div>
  </div>

  <section class="out">
    <div class="out__head">
      <span class="tag" id="tag">Prompt text</span>
      <button class="copy" id="copy">Copy</button>
    </div>
    <p id="sentence">&nbsp;</p>
  </section>

  <p class="foot" id="foot">Front of the subject faces the <b>FRONT</b> marker in the rig view. Left / right are the subject's own.</p>
</div>

<script>
"use strict";
const D2R=Math.PI/180;

/* ---------- tiny vec3 ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return scl(a,1/l)};
const X=[1,0,0],Y=[0,1,0],Z=[0,0,1];

/* ---------- geometry helpers ---------- */
const path=(...p)=>p.slice(1).map((q,i)=>[p[i],q]);
const mirX=ls=>ls.map(([a,b])=>[[-a[0],a[1],a[2]],[-b[0],b[1],b[2]]]);
function box(cx,cy,cz,sx,sy,sz){
  const v=[];
  for(let i=0;i<8;i++)v.push([cx+(i&1?sx:-sx),cy+(i&2?sy:-sy),cz+(i&4?sz:-sz)]);
  return [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].map(([a,b])=>[v[a],v[b]]);
}
function ring(c,u,v,r,n=28){
  const p=[];
  for(let i=0;i<=n;i++){const t=i/n*2*Math.PI,co=Math.cos(t)*r,si=Math.sin(t)*r;
    p.push([c[0]+u[0]*co+v[0]*si, c[1]+u[1]*co+v[1]*si, c[2]+u[2]*co+v[2]*si]);}
  return path(...p);
}

/* ---------- subjects (all face +Z) ---------- */
function sphereLines(r){
  const out=[];
  for(let m=0;m<6;m++){const a=m/6*Math.PI;out.push(...ring([0,0,0],[Math.cos(a),0,Math.sin(a)],Y,r,30));}
  for(let k=1;k<=4;k++){const y=-r+2*r*k/5,rr=Math.sqrt(Math.max(0,r*r-y*y));out.push(...ring([0,y,0],X,Z,rr,30));}
  return out;
}
function human(){
  const L=[];
  L.push(...box(0,.72,0,.13,.16,.12));                    // head
  L.push(...path([0,.72,.12],[0,.695,.235]));             // nose
  L.push(...path([0,.50,0],[0,.56,0]));                   // neck
  L.push(...box(0,.22,0,.22,.28,.115));                   // torso
  L.push(...box(0,-.12,0,.17,.09,.105));                  // pelvis
  const arm=path([.22,.46,0],[.30,.16,.05],[.30,-.10,.12]);
  L.push(...arm,...mirX(arm));
  const leg=path([.11,-.21,0],[.12,-.55,.02],[.12,-.88,-.02],[.12,-.90,.13]);
  L.push(...leg,...mirX(leg));
  return L;
}
function car(){
  const L=[...box(0,.05,0,.42,.2,1.0),...box(0,.36,-.10,.36,.16,.5)];
  const w=(x,z)=>ring([x,-.15,z],Y,Z,.22,20);
  L.push(...w(.44,.62),...w(-.44,.62),...w(.44,-.62),...w(-.44,-.62));

/* ---------- camera + projection ---------- */
function camPos(az,el,d){
  const a=az*D2R,e=el*D2R,c=Math.cos(e);
  return [-d*c*Math.sin(a), d*Math.sin(e), d*c*Math.cos(a)];
}
function view(eye,target){
  const f=norm(sub(target,eye));
  const up=Math.abs(f[1])>0.999?Z:Y;
  const r=norm(cross(f,up));
  return {eye,r,u:cross(r,f),f};
}
const toView=(p,V)=>{const q=sub(p,V.eye);return [dot(q,V.r),dot(q,V.u),dot(q,V.f)];};
function padlock(ctx,x,y,s,color,bg){
  ctx.beginPath();ctx.arc(x,y-s*0.42,s*0.30,Math.PI,0);
  ctx.strokeStyle=bg;ctx.lineWidth=s*0.42;ctx.stroke();
  ctx.strokeStyle=color;ctx.lineWidth=s*0.18;ctx.stroke();
  ctx.fillStyle=bg;ctx.fillRect(x-s*0.55,y-s*0.30,s*1.1,s*0.85);
  ctx.fillStyle=color;ctx.fillRect(x-s*0.45,y-s*0.22,s*0.9,s*0.7);
}
function proj(p,V,sc,cx,cy){
  const q=toView(p,V);
  return q[2]<0.05 ? null : [cx+q[0]/q[2]*sc, cy-q[1]/q[2]*sc];
}
function strokeLines(ctx,lines,V,sc,cx,cy){
  const NEAR=0.04;
  ctx.beginPath();
  for(const seg of lines){
    let a=toView(seg[0],V),b=toView(seg[1],V);
    if(a[2]<NEAR&&b[2]<NEAR)continue;
    if(a[2]<NEAR){const t=(NEAR-a[2])/(b[2]-a[2]);a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR];}
    else if(b[2]<NEAR){const t=(NEAR-b[2])/(a[2]-b[2]);b=[b[0]+(a[0]-b[0])*t,b[1]+(a[1]-b[1])*t,NEAR];}
    ctx.moveTo(cx+a[0]/a[2]*sc, cy-a[1]/a[2]*sc);
    ctx.lineTo(cx+b[0]/b[2]*sc, cy-b[1]/b[2]*sc);
  }
  ctx.stroke();
}

/* ---------- state ---------- */
const LENSES=[18,24,35,50,85,135,200];
// The camera position S.p is the truth; az / el / d are derived from it by sync().
// That lets the X/Y/Z steppers and the orbit drag write to the same place.
const S={obj:"cube",p:[0,0,4.5],az:45,el:30,d:4.5,f:50};
const RIG={az:335,el:30,f:28};
let AXES=[];        // screen-space axis segments from the last rig render, for hit-testing
let hoverAx=null;   // which track the cursor is over
const LOCK=[false,false,false];
// Every interactive camera move routes through here, so a locked axis holds
// even when the move came from orbiting or dollying rather than that axis.
function setP(np){
  const o=OBJECTS[S.obj];
  for(let i=0;i<3;i++) if(LOCK[i]) np[i]=S.p[i];
  const d=Math.hypot(np[0],np[1],np[2]);
  if(d<o.dmin||d>o.dmax) return;   // refuse rather than slide the camera sideways to fit
  S.p=np;render();
}
function toggleLock(i){LOCK[i]=!LOCK[i];hoverAx=null;render();}
function nearestAxis(px,py){
  let best=null,bd=12;
  for(const A of AXES){
    if(LOCK[A.comp])continue;
    const vx=A.b[0]-A.a[0],vy=A.b[1]-A.a[1],l2=vx*vx+vy*vy;
    if(l2<4)continue;
    const t=Math.max(0,Math.min(1,((px-A.a[0])*vx+(py-A.a[1])*vy)/l2));
    const d=Math.hypot(px-(A.a[0]+vx*t), py-(A.a[1]+vy*t));
    if(d<bd){bd=d;best=A;}
  }
  return best;
}

const $=id=>document.getElementById(id);
const rigCv=$("rig"),camCv=$("cam"),distEl=$("dist");
const CSS=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function fit(cv){
  const r=cv.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  return dpr;
}
function sync(){
  const o=OBJECTS[S.obj];
  let d=Math.hypot(S.p[0],S.p[1],S.p[2]);
  if(!isFinite(d)||d<o.dmin||d>o.dmax){
    const nd=Math.min(o.dmax,Math.max(o.dmin,isFinite(d)&&d>1e-6?d:o.d0));
    S.p = d>1e-6 ? scl(S.p,nd/d) : [0,0,nd];
    d=nd;
  }
  S.d=d;
  S.el=Math.asin(Math.max(-1,Math.min(1,S.p[1]/d)))/D2R;
  S.az=((Math.atan2(-S.p[0],S.p[2])/D2R)%360+360)%360;
}
// Free XYZ placement means az/el land anywhere, so the wording buckets to the nearest 15°.
const azKey=()=>((Math.round(S.az/15)*15)%360+360)%360;
const elKey=()=>Math.max(-90,Math.min(90,Math.round(S.el/15)*15));

function groundGrid(o){
  const G=o.rad*2.8,n=6,L=[];
  for(let i=0;i<=n;i++){const t=-G+2*G*i/n;
    L.push([[-G,o.ground,t],[G,o.ground,t]],[[t,o.ground,-G],[t,o.ground,G]]);}
  return L;
}

/* ---------- the two views ---------- */
function drawCam(o,lines,grid){
  const dpr=fit(camCv),ctx=camCv.getContext("2d"),W=camCv.width,H=camCv.height;
  ctx.clearRect(0,0,W,H);
  const V=view(camPos(S.az,S.el,S.d),[0,0,0]);
  const sc=(W/2)*S.f/18;                       // 36mm-wide sensor
  // rule of thirds
  ctx.strokeStyle=CSS("--line");ctx.lineWidth=1*dpr;ctx.globalAlpha=.55;ctx.beginPath();
  for(let i=1;i<3;i++){ctx.moveTo(W*i/3,0);ctx.lineTo(W*i/3,H);ctx.moveTo(0,H*i/3);ctx.lineTo(W,H*i/3);}
  ctx.stroke();ctx.globalAlpha=1;
  ctx.lineJoin=ctx.lineCap="round";
  ctx.strokeStyle=CSS("--grid");ctx.lineWidth=1*dpr;strokeLines(ctx,grid,V,sc,W/2,H/2);
  ctx.strokeStyle=CSS("--ink");ctx.lineWidth=1.6*dpr;strokeLines(ctx,lines,V,sc,W/2,H/2);
}
function drawRig(o,lines,grid){
  const dpr=fit(rigCv),ctx=rigCv.getContext("2d"),W=rigCv.width,H=rigCv.height;
  ctx.clearRect(0,0,W,H);
  ctx.lineJoin=ctx.lineCap="round";
  // fit the orbit plus the XYZ tracks hanging off the camera, so nothing clips
  const AL=o.rad*1.5;
  const span=Math.max(S.d,o.rad*1.6)*1.06+AL;
  const V=view(camPos(RIG.az,RIG.el,span*1.7),[0,o.ground*0.3,0]);
  const sc=(W/2)*RIG.f/18;
  const acc=CSS("--accent-line");   // #FFD700 vanishes on ivory; --accent-line stays readable in both themes

  ctx.strokeStyle=CSS("--grid");ctx.lineWidth=1*dpr;strokeLines(ctx,grid,V,sc,W/2,H/2);

  // orbit ring + elevation arc
  const rr=Math.abs(S.d*Math.cos(S.el*D2R)),yy=S.d*Math.sin(S.el*D2R);
  ctx.strokeStyle=acc;ctx.lineWidth=1*dpr;ctx.globalAlpha=.32;
  if(rr>0.06)strokeLines(ctx,ring([0,yy,0],X,Z,rr,48),V,sc,W/2,H/2);
  const arc=[];for(let i=0;i<=14;i++)arc.push(camPos(S.az,S.el*i/14,S.d));
  strokeLines(ctx,path(...arc),V,sc,W/2,H/2);
  ctx.globalAlpha=1;

  ctx.strokeStyle=CSS("--ink");ctx.lineWidth=1.7*dpr;strokeLines(ctx,lines,V,sc,W/2,H/2);

  // camera gizmo: frustum spread tracks the lens
  const eye=camPos(S.az,S.el,S.d),Vc=view(eye,[0,0,0]);
  ctx.setLineDash([3*dpr,4*dpr]);
  ctx.strokeStyle=CSS("--ink-3");ctx.lineWidth=1*dpr;ctx.globalAlpha=.6;
  strokeLines(ctx,[[eye,[eye[0],o.ground,eye[2]]]],V,sc,W/2,H/2);
  ctx.setLineDash([]);ctx.globalAlpha=1;
  const len=Math.min(S.d*0.45,o.rad*1.7);
  const th=Math.tan(Math.atan(18/S.f)),tv=Math.tan(Math.atan(12/S.f));
  const corner=(a,b)=>add(eye,scl(add(add(Vc.f,scl(Vc.r,th*a)),scl(Vc.u,tv*b)),len));
  const c1=corner(1,1),c2=corner(-1,1),c3=corner(-1,-1),c4=corner(1,-1);
  const frustum=[[eye,c1],[eye,c2],[eye,c3],[eye,c4],[c1,c2],[c2,c3],[c3,c4],[c4,c1]];
  ctx.strokeStyle=CSS("--knockout");ctx.lineWidth=4.5*dpr;
  strokeLines(ctx,frustum,V,sc,W/2,H/2);
  ctx.strokeStyle=acc;ctx.lineWidth=1.3*dpr;ctx.globalAlpha=.75;
  strokeLines(ctx,frustum,V,sc,W/2,H/2);
  ctx.globalAlpha=1;
  const bs=Math.max(.09,o.rad*.12);
  const bp=(a,b,c)=>add(eye,add(add(scl(Vc.r,a*bs),scl(Vc.u,b*bs*.75)),scl(Vc.f,c*bs*.9)));
  const v=[];for(let i=0;i<8;i++)v.push(bp(i&1?1:-1,i&2?1:-1,i&4?1:-1));
  const body=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].map(([a,b])=>[v[a],v[b]]);
  ctx.strokeStyle=CSS("--knockout");ctx.lineWidth=5.5*dpr;strokeLines(ctx,body,V,sc,W/2,H/2);
  ctx.strokeStyle=acc;ctx.lineWidth=1.9*dpr;strokeLines(ctx,body,V,sc,W/2,H/2);

  // XYZ tracks through the camera - drawn last so they stay grabbable on top
  // AXD holds the DISPLAYED axis directions: +X reads to the subject's right, which is world -X.
  const AXD=[[-1,0,0],[0,1,0],[0,0,1]];
  const AXC=[CSS("--ax-x"),CSS("--ax-y"),CSS("--ax-z")];
  const steps=Math.floor(AL/0.5);
  AXES=[];
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(let i=0;i<3;i++){
    const d=AXD[i], p0=add(eye,scl(d,-AL)), p1=add(eye,scl(d,AL));
    const perp=i===1?[1,0,0]:[0,1,0];
    const ticks=[];
    for(let n=-steps;n<=steps;n++){
      const c=add(eye,scl(d,n*0.5)), h=(n%2?0.045:0.085)*o.rad;
      ticks.push([add(c,scl(perp,-h)),add(c,scl(perp,h))]);
    }
    ctx.strokeStyle=CSS("--knockout");ctx.lineWidth=4*dpr;
    strokeLines(ctx,[[p0,p1]],V,sc,W/2,H/2);
    ctx.strokeStyle=AXC[i];
    ctx.globalAlpha=LOCK[i]?.42:1;
    if(LOCK[i])ctx.setLineDash([2.5*dpr,3.5*dpr]);
    ctx.lineWidth=(hoverAx===i?2.8:1.4)*dpr;strokeLines(ctx,[[p0,p1]],V,sc,W/2,H/2);
    ctx.setLineDash([]);
    ctx.lineWidth=1.1*dpr;strokeLines(ctx,ticks,V,sc,W/2,H/2);
    ctx.globalAlpha=1;
    const sa=proj(p0,V,sc,W/2,H/2), sb=proj(p1,V,sc,W/2,H/2);
    if(sb){
      ctx.font=`600 ${12.5*dpr}px "IBM Plex Mono",monospace`;
      ctx.lineWidth=3.5*dpr;ctx.strokeStyle=CSS("--knockout");
      ctx.strokeText("XYZ"[i],sb[0],sb[1]);
      ctx.fillStyle=AXC[i];
      ctx.fillText("XYZ"[i],sb[0],sb[1]);
      if(LOCK[i])padlock(ctx,sb[0]+9*dpr,sb[1],7*dpr,AXC[i],CSS("--knockout"));
    }
    if(sa&&sb)AXES.push({comp:i,sign:d[i],L:AL,
      a:[sa[0]/dpr,sa[1]/dpr], b:[sb[0]/dpr,sb[1]/dpr]});
  }

  // FRONT marker
  const fp=proj([0,o.ground,o.rad*2.0],V,sc,W/2,H/2);
  if(fp){
    ctx.fillStyle=CSS("--ink-3");
    ctx.font=`500 ${10.5*dpr}px "IBM Plex Mono",monospace`;
    ctx.fillText(T().ui.front,fp[0],fp[1]);
  }
}

function shotText(o){
  const L=T();
  const frac=Math.max(Math.atan(o.hw/S.d)/Math.atan(18/S.f),
                      Math.atan(o.hh/S.d)/Math.atan(12/S.f));
  const i=frac>1.5?0:frac>1.0?1:frac>0.70?2:frac>0.45?3:frac>0.28?4:frac>0.15?5:6;
  return [L.shot[i][0], fill(L.shot[i][1],{g:L.gen})];
}
function describe(o){
  const L=LANGS[LANG],P=PROMPT[LANG]||PROMPT.en;
  const azk=azKey(),elk=elKey(),s=L.subj[S.obj];
  const parts=[];
  if(o.interior&&S.d<=o.interior){
    parts.push(fill(P.interior,{w:L.walls[Math.round(azk/45)%8]}),P.hor[elk],P.lens[S.f],P.interiorGuard);
    return parts.join(P.join);
  }
  // at +/-90 elevation azimuth changes nothing, so name the face instead of a side
  const vis=Math.abs(elk)===90 ? (elk>0?P.visTop:P.visBottom)
    : fill(P.vis[azk<=180?azk:360-azk],{d:P.sideAdj[azk<180?"r":"l"]});
  parts.push(fill(P.lead,{shot:cap(shotText(o)[0]),s,vis}),P.hor[elk],P.lens[S.f],P.guard);
  return parts.join(P.join);
}

function applyUI(){
  const L=T(),u=L.ui;
  document.documentElement.lang=L.code;
  $("sub").textContent=u.sub;
  $("reset").textContent=u.reset;
  $("capRigLbl").textContent=u.rig;
  $("capCamLbl").textContent=u.cam;
  $("hintRig").textContent=u.hint;
  $("em-x").textContent=u.xe;$("em-y").textContent=u.ye;$("em-z").textContent=u.ze;
  $("lbl-dist").textContent=u.dist;$("lbl-lens").textContent=u.lens;$("lbl-angle").textContent=u.angle;
  $("tag").textContent=u.prompt;$("copy").textContent=u.copy;
  $("foot").innerHTML="";
  u.foot.split("{f}").forEach((part,i)=>{
    if(i){const b=document.createElement("b");b.textContent=u.front;$("foot").appendChild(b);}
    $("foot").appendChild(document.createTextNode(part));
  });
  rigCv.setAttribute("aria-label",u.arRig);
  camCv.setAttribute("aria-label",u.arCam);
  $("lang").setAttribute("aria-label",u.arLang);
  document.querySelectorAll(".lock").forEach(b=>{
    b.textContent=u.lock;
    b.setAttribute("aria-label",fill(u.arLock,{a:"XYZ"[+b.dataset.lock]}));
  });
  document.querySelectorAll(".step button").forEach(b=>
    b.setAttribute("aria-label",`${b.dataset.d==="1"?u.arPlus:u.arMinus} ${"XYZ"[+b.dataset.ax]}`));
  $("objs").innerHTML=Object.keys(OBJECTS)
    .map(k=>`<button data-o="${k}" aria-pressed="false">${L.label[k]}</button>`).join("");
}

/* ---------- render ---------- */
function render(){
  sync();
  const o=OBJECTS[S.obj];
  const lines=o.lines(),grid=o.noGround?[]:groundGrid(o);
  drawRig(o,lines,grid);
  drawCam(o,lines,grid);

  const fx=v=>(Math.abs(v)<0.05?0:v).toFixed(1);
  const x=-S.p[0], y=S.p[1], z=S.p[2];   // shown X points to the subject's right
  $("v-x").textContent=fx(x);
  $("v-y").textContent=fx(y);
  $("v-z").textContent=fx(z);
  const L=T(),u=L.ui,sj=L.subj[S.obj];
  $("n-x").textContent=Math.abs(x)<0.05?u.nCentred:fill(u.nSide,{s:sj,d:L.side[x>0?"r":"l"]});
  $("n-y").textContent=Math.abs(y)<0.05?u.nAtH:(y>0?u.nAbove:u.nBelow);
  $("n-z").textContent=Math.abs(z)<0.05?u.nBeside:(z>0?u.nFront:u.nBehind);
  $("v-d").textContent=S.d.toFixed(1);
  const elSign=Math.round(S.el)>0?"+":"";
  $("capRig").textContent=`${u.azAb} ${Math.round(S.az)}° · ${u.elAb} ${elSign}${Math.round(S.el)}°`;
  $("capCam").textContent=`${S.f}mm · ${S.d.toFixed(1)}`;

  const azk=azKey(),elk=elKey();
  const b=azk<=180?azk:360-azk, side=L.side[azk<180?"r":"l"];
  $("v-ang").textContent=`${Math.round(S.az)}° ${u.azAb} · ${elSign}${Math.round(S.el)}° ${u.elAb}`;
  $("n-ang").textContent = (Math.abs(elk)===90?u.aOver:
      b===0?u.aHead:b===180?u.aBehind:b===90?fill(u.aProfile,{d:side}):
      fill(b<90?u.aFrontS:u.aRearS,{d:side}))
    + " · " + (S.el>45?u.eHigh:S.el>0.5?u.eAbove:Math.abs(S.el)<=0.5?u.eEye:
      S.el>-45?u.eBelow:u.eLow);
  $("n-d").textContent = (o.interior&&S.d<=o.interior)?u.nInside:shotText(o)[0];
  $("n-f").textContent = S.f<=24?u.lWide:S.f<50?u.lMild:S.f===50?u.lNeutral:S.f<=85?u.lShort:u.lTele;

  distEl.value=S.d;
  document.querySelectorAll(".lock").forEach(b=>b.setAttribute("aria-pressed",String(LOCK[+b.dataset.lock])));
  document.querySelectorAll(".step button").forEach(b=>b.disabled=LOCK[+b.dataset.ax]);
  $("sentence").textContent=describe(o);
  document.querySelectorAll("#lens button").forEach(el=>
    el.setAttribute("aria-pressed",String(+el.dataset.f===S.f)));
  document.querySelectorAll("#objs button").forEach(el=>
    el.setAttribute("aria-pressed",String(el.dataset.o===S.obj)));
}

/* ---------- input ---------- */
const snap=(v,s)=>Math.round(v/s)*s;
// orbit input still snaps to 15°, so dragging lands on the clean stock angles
function setSph(az,el,d){
  setP(camPos(((snap(az,15)%360)+360)%360, Math.max(-90,Math.min(90,snap(el,15))), d));
}
function setAxis(i,dir){
  if(LOCK[i])return;
  const p=S.p.slice();p[i]=snap(p[i]+dir*0.5,0.5);setP(p);
}
function setD(v){
  const o=OBJECTS[S.obj];
  const d=Math.max(o.dmin,Math.min(o.dmax,snap(v,0.5)));
  const cur=Math.hypot(S.p[0],S.p[1],S.p[2]);
  setP(cur>1e-6 ? scl(S.p,d/cur) : [0,0,d]);
}
function pickObject(k){
  const az=S.az,el=S.el,o=OBJECTS[k];
  S.obj=k;distEl.min=o.dmin;distEl.max=o.dmax;distEl.value=o.d0;
  S.p=camPos(az,el,o.d0);
  render();
}

// chips (labels come from applyUI, which rebuilds them per language)
$("objs").onclick=e=>{const b=e.target.closest("button");if(b)pickObject(b.dataset.o);};
$("lens").innerHTML=LENSES.map(f=>`<button data-f="${f}" aria-pressed="false">${f}</button>`).join("");
$("lens").onclick=e=>{const b=e.target.closest("button");if(b){S.f=+b.dataset.f;render();}};
document.querySelectorAll(".lock").forEach(b=>b.onclick=()=>toggleLock(+b.dataset.lock));

document.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.ax, dir=+b.dataset.d;
  setAxis(i, i===0 ? -dir : dir);   // world +X is the subject's left, so the X button flips
});
distEl.oninput=()=>setD(+distEl.value);
$("reset").onclick=()=>{S.az=45;S.el=30;S.f=50;pickObject(S.obj);};

// drag / wheel / keys on both canvases
for(const cv of [rigCv,camCv]){
  let drag=null;
  cv.addEventListener("pointerdown",e=>{
    cv.setPointerCapture(e.pointerId);
    if(cv===rigCv){
      const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
      for(const A of AXES){
        if(Math.hypot(px-A.b[0],py-A.b[1])<15){toggleLock(A.comp);drag=null;return;}
      }
      const A=nearestAxis(px,py);
      if(A){drag={axis:A,x:e.clientX,y:e.clientY,start:S.p.slice()};return;}
    }
    drag={x:e.clientX,y:e.clientY,az:snap(S.az,15),el:snap(S.el,15)};
  });
  cv.addEventListener("pointermove",e=>{
    if(!drag){
      if(cv===rigCv){
        const r=cv.getBoundingClientRect();
        const A=nearestAxis(e.clientX-r.left,e.clientY-r.top);
        cv.style.cursor=A?"move":"";
        const h=A?A.comp:null;
        if(h!==hoverAx){hoverAx=h;render();}
      }
      return;
    }
    if(drag.axis){
      const A=drag.axis,vx=A.b[0]-A.a[0],vy=A.b[1]-A.a[1],len=Math.hypot(vx,vy);
      // pointer travel projected onto the axis, converted back to world units
      const along=((e.clientX-drag.x)*vx+(e.clientY-drag.y)*vy)/len*(2*A.L/len);
      const p=drag.start.slice();
      p[A.comp]=snap(drag.start[A.comp]+A.sign*along,0.5);
      setP(p);
      return;
    }
    setSph(drag.az+(e.clientX-drag.x)*0.45, drag.el-(e.clientY-drag.y)*0.45, S.d);
  });
  const end=()=>{drag=null;};
  cv.addEventListener("pointerleave",()=>{if(hoverAx!==null){hoverAx=null;render();}});
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointercancel",end);
  cv.addEventListener("wheel",e=>{e.preventDefault();setD(S.d+Math.sign(e.deltaY)*0.5);},{passive:false});
  cv.addEventListener("keydown",e=>{
    const k=e.key;
    const a=snap(S.az,15), e2=snap(S.el,15);
    if(k==="ArrowLeft")setSph(a-15,e2,S.d); else if(k==="ArrowRight")setSph(a+15,e2,S.d);
    else if(k==="ArrowUp")setSph(a,e2+15,S.d); else if(k==="ArrowDown")setSph(a,e2-15,S.d);
    else if(k==="+"||k==="=")setD(S.d-0.5); else if(k==="-"||k==="_")setD(S.d+0.5);
    else return;
    e.preventDefault();
  });
}

$("copy").onclick=async()=>{
  const btn=$("copy"),txt=$("sentence").textContent;
  try{await navigator.clipboard.writeText(txt);btn.textContent=T().ui.copied;btn.dataset.done="1";}
  catch{
    const r=document.createRange();r.selectNodeContents($("sentence"));
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    btn.textContent=T().ui.cfail;btn.dataset.done="1";
  }
  setTimeout(()=>{btn.textContent=T().ui.copy;delete btn.dataset.done;},1500);
};

new ResizeObserver(render).observe(document.querySelector(".stage"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.fonts&&document.fonts.ready.then(render);
$("lang").innerHTML=Object.entries(LANGS)
  .map(([k,L])=>`<option value="${k}">${L.name}</option>`).join("");
$("lang").value=LANG;
$("lang").onchange=e=>{LANG=e.target.value;store.set("fta-lang",LANG);applyUI();render();};

applyUI();
pickObject("cube");
</script>
